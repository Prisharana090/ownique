# 🤖 Grok Bot: on every push to main, Grok (xAI) reads what changed and
# writes a plain-English summary into CHANGELOG.md (and optionally posts it to Discord).
# Setup: GitHub repo → Settings → Secrets and variables → Actions →
#   New secret XAI_API_KEY (required), DISCORD_WEBHOOK_URL (optional).
name: Grok Bot changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask Grok to summarize this push
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROK_MODEL: grok-4.7
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/grok-bot.mjs
      - name: Commit the changelog
        run: |
          git config user.name "grok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md 2>/dev/null || exit 0
          git diff --cached --quiet && { echo "No changelog update"; exit 0; }
          git commit -m "🤖 Grok Bot: update changelog [skip ci]"
          git push
